<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- soft colour glows -->
    <radialGradient id="glowBlue" cx="18%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#2b4a8b" stop-opacity="0.60"/>
      <stop offset="60%" stop-color="#2b4a8b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2b4a8b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="88%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#5b2a7a" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#5b2a7a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5b2a7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="50%" cy="105%" r="75%">
      <stop offset="0%" stop-color="#0f5c5c" stop-opacity="0.50"/>
      <stop offset="55%" stop-color="#0f5c5c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0f5c5c" stop-opacity="0"/>
    </radialGradient>

    <!-- faint dot grid -->
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>

    <!-- diagonal sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#0b0e13"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glowBlue)"/>
  <rect width="1600" height="1000" fill="url(#glowPurple)"/>
  <rect width="1600" height="1000" fill="url(#glowTeal)"/>
  <rect width="1600" height="1000" fill="url(#sheen)"/>
</svg>
